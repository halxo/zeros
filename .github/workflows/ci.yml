name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      - run: pytest -q tests
      - run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck -S warning installer/*.sh scripts/*.sh macshell/*.sh
  e2e-install:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y btrfs-progs dosfstools parted qemu-system-x86 util-linux
      - run: scripts/test-e2e-install.sh
