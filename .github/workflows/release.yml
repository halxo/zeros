# Rolling tag on every green main; named milestone only when manually dispatched.
name: Release
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      milestone: { description: "Mint a named milestone release?", type: boolean, default: false }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute tag
        id: t
        run: |
          cd zeros_py
          if [ "${{ inputs.milestone }}" = "true" ]; then
            used=$(git tag | sed -n 's/^\([a-z]*\)-[0-9.]*$/\u\1/p' | tr '\n' ' ')
            name=$(PYTHONPATH=. python -m zeros.release $used)
            echo "tag=$(PYTHONPATH=. python -c "from zeros import release;print(release.milestone_tag('$name'))")" >> $GITHUB_OUTPUT
            echo "title=Zeros $name" >> $GITHUB_OUTPUT
            echo "pre=false" >> $GITHUB_OUTPUT
          else
            echo "tag=$(PYTHONPATH=. python -c 'from zeros import release;print(release.rolling_tag())')" >> $GITHUB_OUTPUT
            echo "title=Rolling" >> $GITHUB_OUTPUT
            echo "pre=true" >> $GITHUB_OUTPUT
          fi
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          flags=""; [ "${{ steps.t.outputs.pre }}" = "true" ] && flags="--prerelease"
          gh release create "${{ steps.t.outputs.tag }}" --title "${{ steps.t.outputs.title }}" --generate-notes $flags
