# Gated pipeline: tests -> kernel boot test -> build+verify ISO -> publish.
# Rolling pre-release on every green main push and nightly; named milestone only via manual dispatch.
name: Release
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
    inputs:
      milestone: { description: "Mint a named milestone release?", type: boolean, default: false }
permissions: { contents: write }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pytest -q tests
      - run: sudo apt-get install -y shellcheck && shellcheck -S warning installer/*.sh scripts/*.sh
  kernel-boot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 busybox-static bc flex bison libssl-dev libelf-dev cpio
      - run: scripts/kernel-boot-test.sh
  iso:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs: { tag: "${{ steps.t.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Compute tag
        id: t
        run: |
          cd zeros_py
          if [ "${{ inputs.milestone }}" = "true" ]; then
            used=$(git tag | sed -n 's/^\([a-z]*\)-[0-9.]*$/\u\1/p' | tr '\n' ' ')
            name=$(PYTHONPATH=. python -m zeros.release $used)
            echo "tag=$(PYTHONPATH=. python -c "from zeros import release;print(release.milestone_tag('$name'))")" >> "$GITHUB_OUTPUT"
            echo "title=Zeros $name" >> "$GITHUB_OUTPUT"; echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(PYTHONPATH=. python -c 'from zeros import release;print(release.rolling_tag())')" >> "$GITHUB_OUTPUT"
            echo "title=Zeros Rolling" >> "$GITHUB_OUTPUT"; echo "pre=true" >> "$GITHUB_OUTPUT"
          fi
      - run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools qemu-system-x86 isolinux
      - run: sudo ISO_TAG="${{ steps.t.outputs.tag }}" scripts/build-iso.sh
      - run: scripts/iso-verify.sh "out/zeros-${{ steps.t.outputs.tag }}.iso"
      - uses: actions/upload-artifact@v4
        with: { name: iso, path: "out/*", retention-days: 7 }
      - name: Output meta
        run: echo "ok"
  publish:
    needs: [kernel-boot, iso]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: iso, path: out }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${{ needs.iso.outputs.tag }}"
          if [ "${{ inputs.milestone }}" = "true" ]; then pre=""; title="Zeros ${tag%%-*}"; else pre="--prerelease"; title="Zeros Rolling"; fi
          gh release create "$tag" out/* --title "$title" --generate-notes $pre
      - name: Prune old rolling releases (keep 3)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release list --limit 100 --json tagName,isPrerelease -q '.[]|select(.isPrerelease)|.tagName' | tail -n +4 | while read -r t; do gh release delete "$t" --cleanup-tag -y; done
