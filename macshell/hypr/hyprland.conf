# Zeros macshell: Mac-flavoured Hyprland
monitor=,preferred,auto,auto
exec-once = waybar
exec-once = nwg-dock-hyprland -d -i 48 -mb 8
exec-once = swaybg -c 1e1e2e
$mod = SUPER
general { gaps_in=6 gaps_out=12 border_size=1 col.active_border=rgba(ffffff55) col.inactive_border=rgba(00000000) layout=dwindle }
decoration { rounding=12 blur { enabled=true size=8 passes=3 } shadow { enabled=true range=20 } }
animations { enabled=true bezier=mac,0.2,0.9,0.3,1.0 animation=windows,1,5,mac,popin 85% animation=fade,1,5,mac }
input { natural_scroll=true touchpad { natural_scroll=true tap-to-click=true } }
gestures { workspace_swipe=true workspace_swipe_fingers=3 }
bind = $mod, SPACE, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod, RETURN, exec, kitty
bind = $mod, F, fullscreen
bind = $mod, left, workspace, e-1
bind = $mod, right, workspace, e+1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
